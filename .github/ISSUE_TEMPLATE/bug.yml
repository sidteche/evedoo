name: Bug report
description: Something crashes, fails or behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach a full scan report or `scan_history.db`.** They list the weaknesses of your machine. Paste only the lines needed to show the problem.
        For a vulnerability in Evedoo itself, use private reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Evedoo version or commit
      description: Output of `evedoo --version`, or the commit you built
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got
    validations:
      required: true
