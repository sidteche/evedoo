[package]
name = "evedoo-gui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GUI companion for the Evedoo vulnerability scanner"
authors = ["Evedoo Contributors"]
repository = "https://github.com/sidteche/evedoo"
publish = false

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rfd = "0.15"
